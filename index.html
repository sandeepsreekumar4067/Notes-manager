<!DOCTYPE html>
<html lang="en">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0f13;
      --surface: #16181f;
      --surface2: #1e2029;
      --border: rgba(255,255,255,0.07);
      --accent: #c8a96e;
      --accent2: #e8c98e;
      --text: #e8e6e0;
      --muted: #7a7870;
      --pill-bg: rgba(200, 169, 110, 0.12);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Decorative background */
    body::before {
      content: '';
      position: fixed;
      top: -30%;
      right: -20%;
      width: 600px;
      height: 600px;
      background: radial-gradient(ellipse, rgba(200,169,110,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    #app { position: relative; z-index: 1; }

    /* Header */
    header {
      padding: 2.5rem 3rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
    }

    .logo-area h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1;
    }

    .logo-area h1 span { color: var(--accent); }

    .logo-area p {
      margin-top: 0.4rem;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .search-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .search-wrap input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 1rem 0.6rem 2.4rem;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      width: 220px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-wrap input::placeholder { color: var(--muted); }
    .search-wrap input:focus { border-color: rgba(200,169,110,0.4); }

    .search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.9rem;
      pointer-events: none;
    }

    /* Main layout */
    main {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: calc(100vh - 100px);
    }

    /* Sidebar */
    aside {
      border-right: 1px solid var(--border);
      padding: 1.5rem 0;
      position: sticky;
      top: 0;
      height: calc(100vh - 100px);
      overflow-y: auto;
    }

    aside::-webkit-scrollbar { width: 4px; }
    aside::-webkit-scrollbar-track { background: transparent; }
    aside::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .sidebar-label {
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 1.5rem;
      margin-bottom: 0.75rem;
    }

    .subject-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0.65rem 1.5rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 400;
      text-align: left;
      transition: all 0.15s;
      border-left: 2px solid transparent;
      gap: 0.5rem;
    }

    .subject-btn:hover { color: var(--text); background: var(--surface); }

    .subject-btn.active {
      color: var(--accent);
      border-left-color: var(--accent);
      background: var(--pill-bg);
      font-weight: 500;
    }

    .subject-count {
      font-size: 0.72rem;
      background: var(--surface2);
      color: var(--muted);
      padding: 0.15rem 0.5rem;
      border-radius: 20px;
      flex-shrink: 0;
    }

    .subject-btn.active .subject-count {
      background: rgba(200,169,110,0.2);
      color: var(--accent);
    }

    /* Content area */
    .content {
      padding: 2.5rem 3rem;
    }

    /* Breadcrumb */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .breadcrumb span { cursor: pointer; transition: color 0.15s; }
    .breadcrumb span:hover { color: var(--accent); }
    .breadcrumb .sep { color: var(--border); }
    .breadcrumb .current { color: var(--text); cursor: default; }

    /* Subject header */
    .subject-header {
      margin-bottom: 2.5rem;
    }

    .subject-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 0.4rem;
    }

    .subject-header .meta {
      font-size: 0.82rem;
      color: var(--muted);
    }

    /* Professor section */
    .professor-section { margin-bottom: 3rem; }

    .professor-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .prof-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent) 0%, var(--surface2) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--bg);
      flex-shrink: 0;
      letter-spacing: 0;
    }

    .prof-info h3 {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
    }

    .prof-info span {
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* Notes grid */
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1rem;
    }

    .note-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: border-color 0.2s, transform 0.2s, background 0.2s;
      cursor: default;
    }

    .note-card:hover {
      border-color: rgba(200,169,110,0.3);
      background: var(--surface2);
      transform: translateY(-2px);
    }

    .note-icon {
      width: 36px;
      height: 44px;
      background: rgba(200,169,110,0.1);
      border: 1px solid rgba(200,169,110,0.2);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      position: relative;
    }

    .note-icon::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 10px; height: 10px;
      background: var(--surface2);
      border-left: 1px solid rgba(200,169,110,0.2);
      border-bottom: 1px solid rgba(200,169,110,0.2);
      border-radius: 0 4px 0 4px;
    }

    .note-title {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.4;
      flex: 1;
    }

    .note-meta {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .note-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--pill-bg);
      border: 1px solid rgba(200,169,110,0.25);
      color: var(--accent);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.76rem;
      font-weight: 500;
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }

    .download-btn:hover {
      background: rgba(200,169,110,0.22);
      border-color: rgba(200,169,110,0.5);
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--muted);
    }

    .empty .emoji { font-size: 2.5rem; margin-bottom: 1rem; }
    .empty h3 { font-size: 1.1rem; color: var(--text); margin-bottom: 0.5rem; }
    .empty p { font-size: 0.85rem; }

    /* Landing state */
    .landing {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 5rem 2rem;
      gap: 1rem;
    }

    .landing-icon { font-size: 3rem; opacity: 0.4; }

    .landing h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      color: var(--text);
    }

    .landing p { font-size: 0.88rem; color: var(--muted); max-width: 340px; }

    /* Tags/chips row */
    .tag {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      background: var(--surface2);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    /* Responsive */
    @media (max-width: 768px) {
      header { padding: 1.5rem; flex-direction: column; align-items: flex-start; }
      .search-wrap input { width: 100%; }
      main { grid-template-columns: 1fr; }
      aside { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); padding: 1rem 0; display: flex; overflow-x: auto; gap: 0; }
      .sidebar-label { display: none; }
      .subject-btn { white-space: nowrap; border-left: none; border-bottom: 2px solid transparent; padding: 0.5rem 1rem; }
      .subject-btn.active { border-left-color: transparent; border-bottom-color: var(--accent); }
      .content { padding: 1.5rem; }
    }

    /* Fade transition */
    .fade-enter-active, .fade-leave-active { transition: opacity 0.2s; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }

</head>
<body>
<div id="app">
  <header>
    <div class="logo-area">
      <h1>Class<span>Notes</span></h1>
      <p>{{ semester }} · {{ department }}</p>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" v-model="search" placeholder="Search notes…" />
    </div>
  </header>

  <main>
    <!-- Sidebar: subjects -->
    <aside>
      <div class="sidebar-label">Subjects</div>
      <button
        v-for="subject in notesData"
        :key="subject.name"
        class="subject-btn"
        :class="{ active: activeSubject === subject.name }"
        @click="selectSubject(subject.name)"
      >
        <span>{{ subject.name }}</span>
        <span class="subject-count">{{ totalNotes(subject) }}</span>
      </button>
    </aside>

    <!-- Content -->
    <div class="content">

      <!-- Search results -->
      <template v-if="search.trim()">
        <div class="breadcrumb">
          <span @click="search = ''">Home</span>
          <span class="sep">›</span>
          <span class="current">Search: "{{ search }}"</span>
        </div>
        <div class="subject-header">
          <h2>Search Results</h2>
          <div class="meta">{{ searchResults.length }} note(s) found</div>
        </div>
        <div v-if="searchResults.length === 0" class="empty">
          <div class="emoji">🔍</div>
          <h3>No notes found</h3>
          <p>Try a different keyword</p>
        </div>
        <div v-for="group in searchResults" :key="group.subject + group.professor">
          <div class="professor-section">
            <div class="professor-header">
              <div class="prof-avatar">{{ initials(group.professor) }}</div>
              <div class="prof-info">
                <h3>{{ group.professor }}</h3>
                <span>{{ group.subject }}</span>
              </div>
            </div>
            <div class="notes-grid">
              <div class="note-card" v-for="note in group.notes" :key="note.title">
                <div class="note-icon">📄</div>
                <div class="note-title">{{ note.title }}</div>
                <div class="note-footer">
                  <span class="note-meta">{{ note.pages ? note.pages + ' pages' : 'PDF' }}</span>
                  <a class="download-btn" :href="note.url" target="_blank" download>
                    ⬇ Download
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- No subject selected -->
      <template v-else-if="!activeSubject">
        <div class="landing">
          <div class="landing-icon">📚</div>
          <h2>Pick a Subject</h2>
          <p>Select a subject from the sidebar to browse notes by professor.</p>
        </div>
      </template>

      <!-- Subject selected -->
      <template v-else>
        <div class="breadcrumb">
          <span @click="activeSubject = null">Home</span>
          <span class="sep">›</span>
          <span class="current">{{ activeSubject }}</span>
        </div>

        <div class="subject-header">
          <h2>{{ activeSubject }}</h2>
          <div class="meta">
            {{ currentSubject.professors.length }} professor(s) ·
            {{ totalNotes(currentSubject) }} note(s)
          </div>
        </div>

        <div class="professor-section" v-for="prof in currentSubject.professors" :key="prof.name">
          <div class="professor-header">
            <div class="prof-avatar">{{ initials(prof.name) }}</div>
            <div class="prof-info">
              <h3>{{ prof.name }}</h3>
              <span>{{ prof.notes.length }} note(s)</span>
            </div>
          </div>
          <div class="notes-grid">
            <div class="note-card" v-for="note in prof.notes" :key="note.title">
              <div class="note-icon">📄</div>
              <div class="note-title">{{ note.title }}</div>
              <div class="note-footer">
                <span class="note-meta">{{ note.pages ? note.pages + ' pages' : 'PDF' }}</span>
                <a class="download-btn" :href="note.url" target="_blank" download>
                  ⬇ Download
                </a>
              </div>
            </div>
          </div>
        </div>
      </template>

    </div>
  </main>
</div>

const { createApp, ref, computed } = Vue;

  setup() {
    const notesData = ref(NOTES_DATA);
    const activeSubject = ref(null);
    const search = ref('');

    const semester = SITE_CONFIG.semester;
    const department = SITE_CONFIG.department;

    const currentSubject = computed(() =>
      notesData.value.find(s => s.name === activeSubject.value)
    );

    function selectSubject(name) {
      activeSubject.value = name;
      search.value = '';
    }

    function totalNotes(subject) {
      return subject.professors.reduce((acc, p) => acc + p.notes.length, 0);
    }

    function initials(name) {
      return name.split(' ').filter(Boolean).map(w => w[0].toUpperCase()).slice(0, 2).join('');
    }

    const searchResults = computed(() => {
      const q = search.value.trim().toLowerCase();
      if (!q) return [];
      const results = [];
      for (const subject of notesData.value) {
        for (const prof of subject.professors) {
          const matched = prof.notes.filter(n =>
            n.title.toLowerCase().includes(q) ||
            prof.name.toLowerCase().includes(q) ||
            subject.name.toLowerCase().includes(q)
          );
          if (matched.length) {
            results.push({ subject: subject.name, professor: prof.name, notes: matched });
          }
        }
      }
      return results;
    });

    return {
      notesData, activeSubject, search,
      semester, department,
      currentSubject, selectSubject,
      totalNotes, initials, searchResults,
    };
  }
}).mount('#app');
</script>
